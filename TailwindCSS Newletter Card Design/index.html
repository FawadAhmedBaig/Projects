<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tailwind CSS Cli</title>
    <link href="./output.css" rel="stylesheet"/> 
</head>
<body>
    <div class="mt-20 mx-44 flex flex-wrap rounded-lg border-2">
        <div class="h-20 bg-linear-to-t from-sky-500 to-indigo-500 text-white flex justify-center items-center font-bold text-xl w-full rounded-t">News you can trust.</div>
        <div class="text-center mt-6 w-full">
            <h3 class="text-lg font-semibold">Stay up to date with the latest!</h3>
            <p>Subscribe to our newsletter for the latest news straight into your inbox.</p>
            <form class="flex flex-wrap ">
                <input class="w-full mx-52 md:mx-24 bg-slate-200 placeholder:text-sm my-4 py-2 rounded" placeholder="your@email.com">
                <button class="w-full md:mx-24 bg-blue-500 text-white mx-52 py-2 rounded-full">Subscribe Now</button>
            </form>
            <p class="my-6">We value your privacy</p>
        </div>
    </div>
</body>
</html>
