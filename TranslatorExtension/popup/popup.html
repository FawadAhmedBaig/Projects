<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LinguaSub Settings</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">

    <!-- Header -->
    <header class="popup-header">
      <div class="logo-row">
        <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M5 8l6 6"></path>
          <path d="M4 14l6-6 2-3"></path>
          <path d="M2 5h12"></path>
          <path d="M7 2h1"></path>
          <path d="M22 22l-5-10-5 10"></path>
          <path d="M14 18h6"></path>
        </svg>
        <h1 class="logo-text">LinguaSub</h1>
      </div>
      <p class="tagline">Interactive dual subtitles for language learning</p>
    </header>

    <!-- Enable toggle -->
    <div class="setting-row toggle-row">
      <label for="ll-toggle" class="setting-label">Enable Subtitles</label>
      <label class="toggle-switch" for="ll-toggle">
        <input type="checkbox" id="ll-toggle" checked>
        <span class="toggle-slider"></span>
      </label>
    </div>

    <hr class="divider">

    <!-- Source language -->
    <div class="setting-row">
      <label for="ll-src-lang" class="setting-label">Source Language</label>
      <select id="ll-src-lang" class="setting-select">
        <option value="en">English</option>
        <option value="es">Spanish</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh">Chinese</option>
        <option value="ar">Arabic</option>
        <option value="hi">Hindi</option>
        <option value="tr">Turkish</option>
        <option value="nl">Dutch</option>
        <option value="sv">Swedish</option>
        <option value="auto">Auto-detect</option>
      </select>
    </div>

    <!-- Target language -->
    <div class="setting-row">
      <label for="ll-tgt-lang" class="setting-label">Target Language</label>
      <select id="ll-tgt-lang" class="setting-select">
        <option value="es">Spanish</option>
        <option value="en">English</option>
        <option value="fr">French</option>
        <option value="de">German</option>
        <option value="it">Italian</option>
        <option value="pt">Portuguese</option>
        <option value="ru">Russian</option>
        <option value="ja">Japanese</option>
        <option value="ko">Korean</option>
        <option value="zh">Chinese</option>
        <option value="ar">Arabic</option>
        <option value="hi">Hindi</option>
        <option value="tr">Turkish</option>
        <option value="nl">Dutch</option>
        <option value="sv">Swedish</option>
        <option value="ur">Urdu</option>
      </select>
    </div>

    <hr class="divider">

    <!-- Colour theme -->
    <div class="setting-row color-row">
      <span class="setting-label">Subtitle Colour</span>
      <div class="color-swatches" id="ll-color-swatches">
        <button class="swatch" data-color="#FFFFFF" title="White" style="background:#FFFFFF;"></button>
        <button class="swatch" data-color="#FBBF24" title="Yellow" style="background:#FBBF24;"></button>
        <button class="swatch active" data-color="#38BDF8" title="Sky Blue" style="background:#38BDF8;"></button>
        <button class="swatch" data-color="#4ADE80" title="Light Green" style="background:#4ADE80;"></button>
      </div>
    </div>

    <!-- Font size controls -->
    <div class="setting-row font-size-row">
      <span class="setting-label">Font Size</span>
      <div class="font-size-controls">
        <button class="font-size-btn" id="ll-font-decrease" title="Decrease font size">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
        <span class="font-size-value" id="ll-font-value">18px</span>
        <button class="font-size-btn" id="ll-font-increase" title="Increase font size">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        </button>
      </div>
    </div>

    <!-- Footer -->
    <footer class="popup-footer">
      <span class="version">v1.0.0</span>
      <button id="ll-reset" class="reset-btn" title="Reset to defaults">Reset</button>
    </footer>

  </div>

  <script src="popup.js"></script>
</body>
</html>
