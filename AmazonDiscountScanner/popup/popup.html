<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Amazon Discount Scanner</title>
  <style>
    /* ── Reset & Base ───────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0f1117;
      --surface:   #1a1d27;
      --surface2:  #232733;
      --border:    #2e3345;
      --text:      #e4e6f0;
      --text-dim:  #8b8fa5;
      --accent:    #6c5ce7;
      --accent-h:  #8577ed;
      --green:     #00b894;
      --orange:    #fdcb6e;
      --red:       #ff7675;
      --blue:      #74b9ff;
      --radius:    10px;
    }

    body {
      width: 420px;
      min-height: 520px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 0;
      overflow-x: hidden;
    }

    /* ── Header ─────────────────────────────────────────── */
    .header {
      background: linear-gradient(135deg, #6c5ce7 0%, #a855f7 100%);
      padding: 18px 20px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header svg { flex-shrink: 0; }
    .header h1 {
      font-size: 16px;
      font-weight: 700;
      letter-spacing: -0.3px;
      color: #fff;
    }
    .header p {
      font-size: 11px;
      color: rgba(255,255,255,.72);
      margin-top: 2px;
    }

    /* ── Sections ────────────────────────────────────────── */
    .section {
      padding: 14px 18px;
      border-bottom: 1px solid var(--border);
    }
    .section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-dim);
      margin-bottom: 10px;
    }

    /* ── Toggle Rows ─────────────────────────────────────── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 7px 0;
    }
    .toggle-label {
      font-size: 13px;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .toggle-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* Toggle switch */
    .switch {
      position: relative;
      width: 38px; height: 20px;
      flex-shrink: 0;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0;
      background: var(--surface2);
      border-radius: 20px;
      cursor: pointer;
      transition: background .2s;
    }
    .slider::before {
      content: '';
      position: absolute;
      width: 14px; height: 14px;
      left: 3px; bottom: 3px;
      background: var(--text-dim);
      border-radius: 50%;
      transition: transform .2s, background .2s;
    }
    .switch input:checked + .slider { background: var(--accent); }
    .switch input:checked + .slider::before {
      transform: translateX(18px);
      background: #fff;
    }

    /* ── Inputs ──────────────────────────────────────────── */
    .input-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .input-group label {
      font-size: 13px;
      white-space: nowrap;
    }
    .input-field {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      padding: 7px 10px;
      outline: none;
      transition: border-color .2s;
    }
    .input-field:focus { border-color: var(--accent); }
    .input-field::placeholder { color: var(--text-dim); }

    .row-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    /* ── Buttons ─────────────────────────────────────────── */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      padding: 10px 16px;
      cursor: pointer;
      transition: transform .1s, box-shadow .2s, opacity .2s;
      width: 100%;
    }
    .btn:active { transform: scale(.97); }
    .btn:disabled { opacity: .45; cursor: not-allowed; }

    .btn-primary {
      background: linear-gradient(135deg, #6c5ce7, #a855f7);
      color: #fff;
      box-shadow: 0 2px 12px rgba(108,92,231,.35);
    }
    .btn-danger {
      background: linear-gradient(135deg, #e74c3c, #ff7675);
      color: #fff;
    }
    .btn-outline {
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
    }
    .btn-outline:hover { border-color: var(--accent); color: var(--accent-h); }

    .btn-sm {
      font-size: 12px;
      padding: 8px 10px;
      border-radius: 6px;
    }

    .actions-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    /* ── Status Panel ────────────────────────────────────── */
    .status-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 12px 14px;
    }
    .status-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }
    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--text-dim);
    }
    .status-dot.active {
      background: var(--green);
      box-shadow: 0 0 6px rgba(0,184,148,.6);
      animation: pulse 1.2s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: .4; }
    }
    .status-count {
      font-size: 12px;
      color: var(--text-dim);
    }
    .status-count strong {
      color: var(--accent-h);
      font-size: 16px;
    }

    .log-box {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      height: 100px;
      overflow-y: auto;
      padding: 8px 10px;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 11px;
      line-height: 1.6;
      color: var(--text-dim);
    }
    .log-box::-webkit-scrollbar { width: 4px; }
    .log-box::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .log-entry { white-space: nowrap; }
    .log-entry .time { color: var(--text-dim); margin-right: 6px; }
    .log-entry.info { color: var(--blue); }
    .log-entry.success { color: var(--green); }
    .log-entry.warn { color: var(--orange); }
    .log-entry.error { color: var(--red); }

    /* ── Export Section ──────────────────────────────────── */
    .export-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
    }

    /* ── Footer ──────────────────────────────────────────── */
    .footer {
      text-align: center;
      padding: 10px;
      font-size: 10px;
      color: var(--text-dim);
    }

    /* Progress bar */
    .progress-bar-container {
      width: 100%;
      height: 3px;
      background: var(--bg);
      border-radius: 2px;
      margin-top: 8px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--green));
      border-radius: 2px;
      transition: width .4s ease;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="8"/>
      <line x1="21" y1="21" x2="16.65" y2="16.65"/>
    </svg>
    <div>
      <h1>Amazon Discount Scanner</h1>
      <p>Scan &bull; Filter &bull; Export ASINs</p>
    </div>
  </div>

  <!-- Discount Type Toggles -->
  <div class="section">
    <div class="section-title">Discount Types to Detect</div>

    <div class="toggle-row">
      <span class="toggle-label"><span class="toggle-dot" style="background:#00b894"></span>Coupon Discounts</span>
      <label class="switch"><input type="checkbox" id="toggle-coupon" checked /><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label"><span class="toggle-dot" style="background:#fdcb6e"></span>Save at Checkout</span>
      <label class="switch"><input type="checkbox" id="toggle-checkout" checked /><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label"><span class="toggle-dot" style="background:#74b9ff"></span>Subscribe &amp; Save</span>
      <label class="switch"><input type="checkbox" id="toggle-subscribe" checked /><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label"><span class="toggle-dot" style="background:#a855f7"></span>Business-Only Pricing</span>
      <label class="switch"><input type="checkbox" id="toggle-business" checked /><span class="slider"></span></label>
    </div>
    <div class="toggle-row">
      <span class="toggle-label"><span class="toggle-dot" style="background:#ff7675"></span>Redeem / Promo Code</span>
      <label class="switch"><input type="checkbox" id="toggle-promo" checked /><span class="slider"></span></label>
    </div>
  </div>

  <!-- Filter Settings -->
  <div class="section">
    <div class="section-title">Filter Settings</div>
    <div class="input-group" style="margin-bottom: 10px;">
      <label for="scanMode">Scan Mode</label>
      <select id="scanMode" class="input-field">
        <option value="standard">Standard Mode</option>
        <option value="mx_direct">Amazon MX Direct Scan (Cross-Check US)</option>
      </select>
    </div>
    <div class="input-group">
      <label for="min-discount">Min Discount %</label>
      <input type="number" id="min-discount" class="input-field" value="20" min="0" max="100" placeholder="e.g. 20" />
    </div>
    <div class="row-2">
      <div class="input-group">
        <label for="max-pages">Max Pages</label>
        <input type="number" id="max-pages" class="input-field" value="20" min="1" max="400" placeholder="20" />
      </div>
      <div class="input-group">
        <label for="delay-base">Delay (s)</label>
        <input type="number" id="delay-base" class="input-field" value="3" min="1" max="30" step="0.5" placeholder="3" />
      </div>
    </div>
  </div>

  <!-- Scan Controls -->
  <div class="section">
    <div class="actions-row">
      <button class="btn btn-primary" id="btn-start">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
        Start Scan
      </button>
      <button class="btn btn-danger" id="btn-stop" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><rect x="4" y="4" width="16" height="16" rx="2"/></svg>
        Stop Scan
      </button>
    </div>
  </div>

  <!-- Status Panel -->
  <div class="section">
    <div class="section-title">Scan Status</div>
    <div class="status-panel">
      <div class="status-top">
        <div class="status-indicator">
          <span class="status-dot" id="status-dot"></span>
          <span id="status-text">Idle</span>
        </div>
        <div class="status-count">
          Found: <strong id="result-count">0</strong>
        </div>
      </div>
      <div class="progress-bar-container">
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <div class="log-box" id="log-box"></div>
    </div>
  </div>

  <!-- Export -->
  <div class="section">
    <div class="section-title">Export Results</div>
    <div class="export-grid">
      <button class="btn btn-outline btn-sm" id="btn-csv">📄 CSV</button>
      <button class="btn btn-outline btn-sm" id="btn-txt">📝 TXT</button>
      <button class="btn btn-outline btn-sm" id="btn-xlsx">📊 Excel</button>
    </div>
    <div style="margin-top:8px;">
      <button class="btn btn-outline btn-sm" id="btn-clear" style="width:100%;color:var(--red);border-color:var(--red);">🗑️ Clear All Results</button>
    </div>
  </div>

  <div class="footer">
    Amazon Discount Scanner v1.0<br/>
    About Developer: <a href="https://www.fiverr.com/s/yvz71zG" target="_blank" style="color:var(--accent-h);text-decoration:none;">Fawad Baig</a>
  </div>

  <!-- SheetJS for Excel export (bundled as a local lib) -->
  <script src="../lib/xlsx.full.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
