<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>DB Price Checker</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css"/>
  
</head>
<body>
  <div class="container" id="popupContainer">
    <div class="header-row">
      <img src="../icons/db_128.png" alt="Icon"/>
      <h1>DB Price Checker</h1>
    </div>

    <div class="switch-row">
      <label class="switch-label">Enable / Disable Extension</label>
      <label class="switch">
        <input type="checkbox" id="enableExtension" checked />
        <span class="slider green"></span>
      </label>
    </div>

    <div class="switch-row">
      <label class="switch-label">Dickbutt Mode Only</label>
      <label class="switch">
        <input type="checkbox" id="dickbuttMode" />
        <span class="slider red"></span>
      </label>
    </div>

    <div class="footer">© 2025 Powered by Simply Dickbutt</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
